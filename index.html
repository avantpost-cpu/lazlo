<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Planning de Terminale — Lazlo</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230c9e92'/%3E%3Cpath d='M32 10v44M10 32h44' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E"><style>
:root{--ink:#171717;--paper:#f4f1e8;--line:#d1ccc0;--teal:#00492C;--yellow:#FFBA16;--blue:#9BCCD0;--red:#E22028;--purple:#1E4380;--pink:#E2B2B4;--navy:#00492C;--orange:#E94B24}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1500px;margin:auto;padding:28px 32px 48px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{font-size:clamp(2rem,4vw,4rem);letter-spacing:.06em;margin:0 0 8px;font-weight:800}h2{font-size:1rem;letter-spacing:.18em;margin:0;color:#555}.tag{font-weight:700;letter-spacing:.04em}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0}.month{min-height:210px;padding:18px 16px;position:relative;display:flex;flex-direction:column;color:#fff;transition:transform .2s,filter .2s}.month:hover{filter:saturate(1.12)}.month.light{color:var(--ink)}.month .num{font-size:4.125rem;line-height:.95;font-weight:800;letter-spacing:.16em}.month h3{font-size:1.35rem;letter-spacing:.12em;margin:18px 0 14px;line-height:1.05}.month p{font-size:1rem;line-height:1.38;margin:0;max-width:28ch}.month button{margin-top:auto;align-self:flex-start;border:1px solid currentColor;background:transparent;color:inherit;padding:7px 10px;font-weight:700;cursor:pointer}.month button:hover{background:#fff;color:var(--ink)}.icon{position:absolute;right:18px;bottom:16px;font-size:2rem;font-weight:700}.teal{background:var(--teal)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.red{background:var(--red)}.purple{background:var(--purple)}.pink{background:var(--pink)}.orange{background:var(--orange)}.navy{background:var(--navy)}.sand{background:#b9b19a}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:0}.panel{background:var(--ink);color:#fff;padding:20px}.panel h3{margin:0 0 14px;color:var(--yellow);letter-spacing:.12em}.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.check{display:flex;gap:10px;align-items:start;font-size:1rem;line-height:1.3}.check input{width:20px;height:20px;accent-color:var(--teal);margin-top:1px}.progress{height:10px;background:#444;margin:12px 0 0}.progress i{display:block;height:100%;background:var(--yellow);width:0;transition:width .3s}.form-section{margin-top:34px}.form-section h3{font-size:1.2rem;letter-spacing:.14em}.form{display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr 1fr auto;gap:8px}.form input{font:inherit;font-size:1rem;padding:12px;border:1px solid var(--line);background:#fff}.form button{border:0;background:var(--red);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.cards{display:grid;gap:8px;margin-top:12px}.school{display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:center}.school span{padding:10px;background:#fff;border:1px solid var(--line);min-height:40px}.school button{border:0;background:transparent;font-size:1.4rem;cursor:pointer}.dates{margin-top:28px;background:var(--yellow);padding:16px;font-weight:700}.dates input{border:0;border-bottom:2px solid var(--ink);background:transparent;font:inherit;width:100%;margin-top:8px;padding:8px 0}.modal{position:fixed;inset:0;background:#171717cc;display:none;place-items:center;padding:24px}.modal.open{display:grid}.modal-card{background:var(--paper);max-width:620px;padding:28px;position:relative}.modal-card h3{font-size:2rem;margin:0 0 12px}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:2rem;cursor:pointer}.status{font-size:.85rem;letter-spacing:.1em;font-weight:800;margin-top:18px}@media(max-width:900px){main{padding:20px 16px}.grid{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form button{padding:12px}.school{grid-template-columns:1fr 1fr}.school span:nth-child(n+3){font-size:.9rem}}@media(max-width:560px){header{display:block}.tag{display:block;margin-top:14px}.grid{grid-template-columns:1fr}.month{min-height:190px}.month .num{font-size:2.75rem;line-height:1}.checklist{grid-template-columns:1fr}.form{grid-template-columns:1fr}.school{grid-template-columns:1fr}.school button{justify-self:end}}
</style></head><body><main><header><div><h1>TERMINALE 2026—2027</h1><h2>LE TABLEAU DE BORD DE LAZLO</h2></div><div class="tag">À tenir à jour toute l’année</div></header><section class="grid" id="months"></section><section class="bottom"><div class="panel"><h3>LE FIL ROUGE</h3><div class="checklist" id="checks"></div><div class="progress"><i id="progress"></i></div><div class="status" id="status"></div></div><div class="panel"><h3>DATES À AJOUTER</h3><label>Évaluations EPS<input class="dateInput" placeholder="date ou période"></label><label>PIX<input class="dateInput" placeholder="date ou période"></label><label>Portes ouvertes / mini-stages<input class="dateInput" placeholder="dates à noter"></label></div></section><section class="form-section"><h3>CARNET DES FORMATIONS</h3><div class="form"><input id="formation" placeholder="Formation"><input id="etablissement" placeholder="Établissement"><input id="ville" placeholder="Ville"><input id="immersion" placeholder="Immersion"><input id="jpo" placeholder="JPO"><input id="portfolio" placeholder="Portfolio"><button id="add">AJOUTER</button></div><div class="cards" id="schools"></div></section></main><div class="modal" id="modal"><div class="modal-card"><button class="close" aria-label="Fermer">×</button><h3 id="modalTitle"></h3><p id="modalText"></p><div class="status" id="modalStatus"></div></div></div><script>
const months=[['Sept.','LANCER','Cyclades • EPS • ordinateur\nClassement des travaux\nPremières recherches','teal','●'],['Oct.','EXPLORER','Formations • DN MADE\nAPPÉA • ANdÉA\nMéthodes philo / arts','yellow','▣'],['Nov.','CONSTITUER','Portfolio : tri, photos\nÉcoles et mini-stages\nPortes ouvertes','blue','⚑'],['Déc.','S’INFORMER','Parcoursup : découvrir l’offre\nPIX : certification possible\nBilan du trimestre','red','✓'],['Janv.','S’ENGAGER','Parcoursup : dossier et vœux\nPIX : rattrapage si besoin\nGrand Oral : problématique','purple','◉'],['Févr.','RENCONTRER','JPO et immersions\nComparer les écoles\nPortfolio : 2e tri','pink','●'],['Mars','CONFIRMER','EPS : évaluation possible\nParcoursup : finaliser les vœux\nAMD / CCDMA : entraînement','teal','▣'],['Avril','FINALISER','Parcoursup : confirmer\nPortfolio presque définitif\nRévisions organisées','orange','⚑'],['Mai','S’ENTRAÎNER','EPS : rattrapages possibles\nSujets complets AMD / CCDMA\nPréparer le Grand Oral','sand','✓'],['Juin','PASSER','Philosophie : 14 juin\nSpécialités : 16—18 juin\nGrand Oral : 21 juin—2 juillet','navy','◉'],['Juil.','CHOISIR','Résultats du Bac\nRéponses Parcoursup\nInscription définitive','teal','●']];
const actions=['Compte Cyclades fonctionnel','Aménagement / certificat EPS vérifié','Aucun devoir non rendu','Certification PIX passée','Portfolio alimenté','Shortlist de formations constituée','Mini-stages et JPO repérés','Ordinateur vérifié'];
const monthsEl=document.querySelector('#months');months.forEach((m,i)=>{const d=document.createElement('article');d.className='month '+m[3]+(m[3]==='yellow'||m[3]==='sand'?' light':'');d.innerHTML=`<div class="num">${m[0]}</div><h3>${m[1]}</h3><p>${m[2].replaceAll('\n','<br>')}</p><div class="icon">${m[4]}</div><button data-i="${i}">VOIR LE DÉTAIL</button>`;monthsEl.append(d)});
const checks=document.querySelector('#checks');actions.forEach((a,i)=>{const l=document.createElement('label');l.className='check';l.innerHTML=`<input type="checkbox" data-check="${i}"><span>${a}</span>`;checks.append(l)});const saved=JSON.parse(localStorage.getItem('lazlo-checks')||'[]');document.querySelectorAll('[data-check]').forEach((x,i)=>{x.checked=!!saved[i];x.addEventListener('change',saveChecks)});function saveChecks(){const a=[...document.querySelectorAll('[data-check]')].map(x=>x.checked);localStorage.setItem('lazlo-checks',JSON.stringify(a));const n=a.filter(Boolean).length;document.querySelector('#progress').style.width=(n/actions.length*100)+'%';document.querySelector('#status').textContent=`${n} / ${actions.length} étapes réalisées`};saveChecks();
const details=['Vérifier Cyclades, EPS et l’équipement. Commencer le classement des travaux.','Repérer les formations et renforcer les méthodes en philosophie et en arts.','Constituer le portfolio et surveiller les inscriptions aux immersions.','Découvrir l’offre Parcoursup et passer PIX si prévu.','Construire le dossier Parcoursup et définir une problématique de Grand Oral.','Participer aux JPO et mini-stages ; comparer concrètement les écoles.','Finaliser les vœux et s’entraîner à AMD / CCDMA.','Confirmer les dossiers et stabiliser le portfolio.','S’entraîner dans les conditions des épreuves et préparer l’oral.','Passer les épreuves : philosophie le 14 juin ; spécialités du 16 au 18 juin ; Grand Oral du 21 juin au 2 juillet.','Suivre les résultats du Bac et finaliser l’inscription.'];const modal=document.querySelector('#modal');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;document.querySelector('#modalTitle').textContent=months[i][0]+' — '+months[i][1];document.querySelector('#modalText').innerHTML=details[i];document.querySelector('#modalStatus').textContent='À programmer / suivre';modal.classList.add('open')});document.querySelector('.close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
let schools=JSON.parse(localStorage.getItem('lazlo-schools')||'[]');function renderSchools(){const el=document.querySelector('#schools');el.innerHTML='';schools.forEach((s,i)=>{const d=document.createElement('div');d.className='school';s.forEach(v=>{const sp=document.createElement('span');sp.textContent=v||'—';d.append(sp)});const b=document.createElement('button');b.textContent='×';b.onclick=()=>{schools.splice(i,1);localStorage.setItem('lazlo-schools',JSON.stringify(schools));renderSchools()};d.append(b);el.append(d)})}renderSchools();document.querySelector('#add').onclick=()=>{const ids=['formation','etablissement','ville','immersion','jpo','portfolio'];const vals=ids.map(id=>document.querySelector('#'+id).value.trim());if(!vals[0]&&!vals[1])return;schools.push(vals);localStorage.setItem('lazlo-schools',JSON.stringify(schools));ids.forEach(id=>document.querySelector('#'+id).value='');renderSchools()};
</script></body></html>

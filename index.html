</style></head><body><main><header><div><h1>Tableau de bord Lazlo</h1><h2>Classe de terminale C<br>Lycée Maximilien Vox 26/27</h2></div><a class="header-catalog-link" href="./formations.html">Carnet des formations</a><div class="tag">Classe de terminale C<br>Lycée Maximilien Vox 26/27</div></header><div class="dashboard-grid"><section class="grid" id="months"></section><section class="bottom"><div class="panel"><h3>Fil rouge/étapes à réaliser</h3><div class="checklist" id="checks"></div><div class="progress"><i id="progress"></i></div><div class="status" id="status"></div></div><div class="panel"><h3>Ajouter une date</h3><label class="event-line"><span class="event-icon" aria-hidden="true">E</span><span>Évaluations EPS</span><input id="date-eps" class="dateInput" type="date" aria-label="Date évaluation EPS"></label><label class="event-line"><span class="event-icon" aria-hidden="true">P</span><span>PIX</span><input id="date-pix" class="dateInput" type="date" aria-label="Date PIX"></label><label class="event-line"><span class="event-icon" aria-hidden="true">↗</span><span>Portes ouvertes / mini-stages</span><input id="date-jpo" class="dateInput" type="date" aria-label="Date JPO ou mini-stage"></label><button id="save-dates" class="save-dates" type="button">AJOUTER LES DATES</button><span id="date-confirm" class="date-confirm" aria-live="polite"></span></div></section><section class="form-section"><a class="catalog-link" href="./formations.html">Carnet des formations <span>↗</span></a></section></div></main><div class="modal" id="modal"><div class="modal-card"><button class="close" aria-label="Fermer">×</button><h3 id="modalTitle"></h3><p id="modalText"></p><div class="status" id="modalStatus"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const months=[['Sept.','LANCER','Cyclades • EPS • ordinateur\nClassement des travaux\nPremières recherches','teal','●'],['Nov.','CONSTITUER','Portfolio : tri, photos\nÉcoles et mini-stages\nPortes ouvertes','blue','⚑'],['Dec.','S’INFORMER','Parcoursup : découvrir l’offre\nPIX : certification possible\nBilan du trimestre','red','✓'],['Janv.','S’ENGAGER','Parcoursup : dossier et vœux\nPIX : rattrapage si besoin\nGrand Oral : problématique','purple','◉'],['Fevr.','RENCONTRER','JPO et immersions\nComparer les écoles\nPortfolio : 2e tri','pink','●'],['Mars','CONFIRMER','EPS : évaluation possible\nParcoursup : finaliser les vœux\nAMD / CCDMA : entraînement','teal','▣'],['Avril','FINALISER','Parcoursup : confirmer\nPortfolio presque définitif\nRévisions organisées','orange','⚑'],['Mai','S’ENTRAÎNER','EPS : rattrapages possibles\nSujets complets AMD / CCDMA\nPréparer le Grand Oral','sand','✓'],['Juin','PASSER','Philosophie : 14 juin\nSpécialités : 16—18 juin\nGrand Oral : 21 juin—2 juillet','navy','◉'],['Juil.','CHOISIR','Résultats du Bac\nRéponses Parcoursup\nInscription définitive','teal','●']];
const actions=['Compte Cyclades fonctionnel','Aménagement / certificat EPS vérifié','Aucun devoir non rendu','Certification PIX passée','Portfolio alimenté','Shortlist de formations constituée','Mini-stages et JPO repérés','Ordinateur vérifié'];
const monthsEl=document.querySelector('#months');months.forEach((m,i)=>{const d=document.createElement('article');d.className='month '+m[3]+(m[3]==='yellow'||m[3]==='sand'?' light':'');const lines=m[2].split(String.fromCharCode(10)).map((line,j)=>'<span class="line"><span class="line-picto">'+(j===0?'●':j===1?'□':'↗')+'</span><span>'+line+'</span></span>').join('');d.innerHTML='<div class="num">'+m[0]+'</div><h3>'+m[1]+'</h3><p>'+lines+'</p><div class="icon">'+m[4]+'</div><button class="month-open" data-i="'+i+'" aria-label="Voir le détail de '+m[0]+'">+</button>';monthsEl.append(d)});
const SUPABASE_URL='https://htkkbudgjwomxpzwirow.supabase.co';const SUPABASE_KEY='sb_publishable_f5l2P6t-qHInZIAZEtE34Q_LdQRYhbz';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const dateInputs=[['date-eps','EPS'],['date-pix','PIX'],['date-jpo','JPO / immersion']];const savedDates={};dateInputs.forEach(([id])=>{const el=document.querySelector('#'+id);if(el)el.value=''});async function loadDates(){const {data,error}=await db.from('events').select('*').order('event_date');if(error)return;data.forEach(e=>{const id=e.kind==='EPS'?'date-eps':e.kind==='PIX'?'date-pix':'date-jpo';savedDates[id]=e.event_date;const el=document.querySelector('#'+id);if(el)el.value=e.event_date});applyDates()}function applyDates(){document.querySelectorAll('.month-dates').forEach(x=>x.remove());const monthMap={9:0,11:1,12:2,1:3,2:4,3:5,4:6,5:7,6:8,7:9};Object.entries(savedDates).forEach(([id,value])=>{if(!value)return;const d=new Date(value+'T12:00:00');const target=document.querySelectorAll('.month')[monthMap[d.getMonth()+1]];if(target){let box=target.querySelector('.month-dates');if(!box){box=document.createElement('div');box.className='month-dates';target.querySelector('p').after(box)}const row=document.createElement('div');row.textContent='◆ '+(id==='date-eps'?'EPS':id==='date-pix'?'PIX':'JPO / immersion')+' — '+d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});box.append(row)}})}loadDates();document.querySelector('#save-dates').onclick=async()=>{dateInputs.forEach(([id])=>{const el=document.querySelector('#'+id);if(el&&el.value)savedDates[id]=el.value;else delete savedDates[id]});await db.from('events').delete().neq('id','00000000-0000-0000-0000-000000000000');const rows=dateInputs.filter(([id])=>savedDates[id]).map(([id,label])=>({label:label,event_date:savedDates[id],kind:label}));if(rows.length)await db.from('events').insert(rows);localStorage.setItem('lazlo-dates',JSON.stringify(savedDates));applyDates();document.querySelector('#date-confirm').textContent='Dates ajoutées ✓';setTimeout(()=>document.querySelector('#date-confirm').textContent='',2500)};const checks=document.querySelector('#checks');actions.forEach((a,i)=>{const l=document.createElement('label');l.className='check';l.innerHTML=`<input type="checkbox" data-check="${i}"><span>${a}</span>`;checks.append(l)});const saved=JSON.parse(localStorage.getItem('lazlo-checks')||'[]');document.querySelectorAll('[data-check]').forEach((x,i)=>{x.checked=!!saved[i];x.addEventListener('change',saveChecks)});function saveChecks(){const a=[...document.querySelectorAll('[data-check]')].map(x=>x.checked);localStorage.setItem('lazlo-checks',JSON.stringify(a));const n=a.filter(Boolean).length;document.querySelector('#progress').style.width=(n/actions.length*100)+'%';document.querySelector('#status').textContent=`${n} / ${actions.length} étapes réalisées`};saveChecks();
const details=[
'Compte Cyclades actif ; inscription EPS ; ordinateur fonctionnel ; classement initial des travaux ; premières recherches documentaires.',
'Portfolio : sélection et tri des travaux ; repérage des écoles ; calendrier des mini-stages ; dates des portes ouvertes.',
'Parcoursup : découverte de l’offre ; certification PIX ; bilan du premier trimestre ; premières pistes de formation.',
'Parcoursup : dossier et vœux ; pièces nécessaires ; certification PIX de rattrapage ; problématique du Grand Oral.',
'Journées portes ouvertes et immersions ; comparaison des écoles ; deuxième sélection du portfolio ; critères d’admission.',
'EPS : calendrier et évaluation ; finalisation des vœux Parcoursup ; entraînement AMD / CCDMA ; derniers arbitrages.',
'Parcoursup : confirmation des vœux ; portfolio presque définitif ; révisions organisées ; préparation des échéances de fin d’année.',
'EPS : rattrapages éventuels ; sujets complets AMD / CCDMA ; préparation du Grand Oral ; vérification des dossiers.',
'Philosophie — 14 juin ; spécialités — 16 au 18 juin ; Grand Oral — 21 juin au 2 juillet ; convocations et organisation pratique.',
'Résultats du Bac ; réponses Parcoursup ; inscription définitive dans l’établissement retenu ; pièces administratives.'
]const modal=document.querySelector('#modal');monthsEl.addEventListener('click',e=>{const card=e.target.closest('.month');if(card&&!e.target.closest('button'))card.querySelector('.month-open')?.click()});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;document.querySelector('#modalTitle').textContent=months[i][0]+' — '+months[i][1];document.querySelector('#modalText').innerHTML=details[i];document.querySelector('#modalStatus').textContent='À programmer / suivre';modal.classList.add('open')});document.querySelector('.close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
let schools=JSON.parse(localStorage.getItem('lazlo-schools')||'[]');function renderSchools(){const el=document.querySelector('#schools');el.innerHTML='';schools.forEach((s,i)=>{const d=document.createElement('div');d.className='school';s.forEach(v=>{const sp=document.createElement('span');sp.textContent=v||'—';d.append(sp)});const b=document.createElement('button');b.textContent='×';b.onclick=()=>{schools.splice(i,1);localStorage.setItem('lazlo-schools',JSON.stringify(schools));renderSchools()};d.append(b);el.append(d)})}renderSchools();document.querySelector('#add').onclick=()=>{const ids=['formation','etablissement','ville','immersion','jpo','portfolio'];const vals=ids.map(id=>document.querySelector('#'+id).value.trim());if(!vals[0]&&!vals[1])return;schools.push(vals);localStorage.setItem('lazlo-schools',JSON.stringify(schools));ids.forEach(id=>document.querySelector('#'+id).value='');renderSchools()};
</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Croquis — Lazlo</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#f8f8f4 url('./fond.jpg') center/cover fixed;color:#242126;font-family:Inter,Arial}main{max-width:1120px;margin:auto;padding:0 34px 50px;background:#fdfdfbaa}header{height:245px;margin:0 -34px 18px;padding:28px 34px;background:#ff7043;position:relative}h1{font-size:clamp(3rem,6vw,5rem);font-weight:400;letter-spacing:-.09em;margin:35px 0}header p{position:absolute;left:40px;bottom:28px;font-size:.8rem}.back{color:#fff;text-decoration:none;position:absolute;right:34px;top:34px;font-size:.75rem}.upload{padding:14px 0;border-bottom:1px solid #242126}.upload input{font:inherit;font-size:.8rem}.upload button{background:#171717;color:#fff;border:0;padding:9px 14px;font-weight:600}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.sketch{position:relative;background:#fff}.sketch img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.sketch-meta{display:block;text-align:right;padding:5px 3px 1px;font-size:.58rem;color:#777;line-height:1.2}.sketch-actions{display:flex;justify-content:flex-end;gap:5px;padding:4px 3px 2px}.sketch-actions a{background:#ff7043;color:#171717;text-decoration:none;padding:5px 7px;font-size:.58rem;font-weight:700}.sketch-actions button{position:static!important}.sketch button{position:absolute;right:6px;top:6px;border:0;background:#ff7043;font-size:1.1rem}.empty{padding:35px 0}@media(max-width:600px){main{padding:0 16px 35px}header{margin:0 -16px 16px;padding:22px 18px;height:210px}h1{font-size:2.7rem;margin-top:45px}.back{right:18px;top:22px}.gallery{grid-template-columns:repeat(2,1fr)}}
/* Cartouche jaune d'ajout des croquis */
.upload{background:#ffff3f!important;padding:14px 16px!important;border:0!important}
.upload input{max-width:70%;font-size:.78rem}.upload button{margin-left:8px}
@media(max-width:600px){.upload input{max-width:100%;width:100%;margin-bottom:8px}.upload button{margin-left:0}}

.folder-modal{display:none;position:fixed;inset:0;background:#171717cc;place-items:center;padding:18px;z-index:10}.folder-modal.open{display:grid}.folder-box{background:#fdfdfb;width:min(900px,100%);max-height:90vh;overflow:auto;padding:24px;position:relative}.folder-box h2{font-size:2rem;font-weight:400}.folder-box #folder-close{position:absolute;right:14px;top:8px;border:0;background:none;font-size:1.7rem}.folder-title{background:#ffff3f;padding:16px;font-size:1.1rem}.folder-box .gallery{grid-template-columns:repeat(3,1fr)}#folder{padding:9px;border:0;border-bottom:1px solid #242126;background:#ffff3f;font:inherit}@media(max-width:600px){#folder{width:100%;margin-bottom:8px}.folder-box .gallery{grid-template-columns:repeat(2,1fr)}}

#folders{grid-template-columns:repeat(4,1fr)!important;gap:0!important}.folder-title{grid-column:1/-1!important;background:transparent!important;padding:14px 0 8px!important;font-size:1.1rem}.folder-card{border:0;border-top:1px solid #242126;background:#ffff3f;text-align:left;padding:14px 12px;min-height:92px;display:flex;flex-direction:column;gap:6px;cursor:pointer}.folder-card+ .folder-card{border-left:1px solid #242126}.folder-card span{font-size:1.4rem}.folder-card strong{font-size:.9rem;font-weight:500}.folder-card small{font-size:.65rem}@media(max-width:700px){#folders{grid-template-columns:repeat(2,1fr)!important}.folder-card:nth-of-type(odd){border-left:0}}

#folder-download{background:#171717;color:#ffff3f;border:0;padding:9px 12px;font:inherit;font-size:.7rem;font-weight:600;cursor:pointer;margin-bottom:12px}.folder-box #folder-download{display:block}

#folder-download{display:block!important;visibility:visible!important;background:#ff7043!important;color:#171717!important;border:0!important;padding:10px 14px!important;font-weight:700!important;cursor:pointer!important}

.sketch button{background:#171717!important;color:#ffff3f!important;border:0!important;padding:5px 7px!important;font-size:.58rem!important;font-weight:700!important;cursor:pointer}

#folders-heading{display:block!important;background:#ffff3f!important;color:#171717!important;padding:10px 12px!important;margin:0 0 14px!important;font-size:1.35rem!important;font-weight:500!important}

.folder-card.empty-folder{background:#d5d5d0!important;color:#777!important}.folder-card.empty-folder small{color:#777}.folder-card small{font-size:.62rem}
.folder-box .sketch{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 16px rgba(36,33,38,.14);padding:7px}.folder-box .sketch img{border-radius:9px}.folder-box .sketch button{right:12px;top:12px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18)}.folder-card{border:0!important;border-radius:50%;aspect-ratio:1;min-height:0!important;width:100%;max-width:190px;justify-self:center;align-items:center;justify-content:center;text-align:center;padding:18px;background:#ff7043!important;color:#171717!important;box-shadow:none;transition:transform .2s ease,filter .2s ease}.folder-card:hover{transform:scale(1.04);filter:saturate(1.08)}.folder-card:nth-of-type(2){background:#ffff3f!important}.folder-card:nth-of-type(3){background:#58e36f!important}.folder-card:nth-of-type(4){background:#ed4caa!important}.folder-card+ .folder-card{border-left:0!important}.folder-card span{font-size:1.2rem}.folder-card strong{font-size:.9rem}.folder-card small{font-size:.62rem;color:inherit}.folder-card.empty-folder{background:#d5d5d0!important;color:#777!important}.folder-card.empty-folder small{color:#777}@media(max-width:700px){#folders{column-gap:12px!important;row-gap:12px!important}.folder-card{max-width:150px}}</style></head><body><main><header><a class="back" href="./index.html">← Tableau de bord</a><h1>Croquis</h1><p>Recherches, essais et projets en cours</p></header><section class="upload"><select id="folder" aria-label="Dossier"><option value="Projets">Projets</option><option value="Experimentations">Expérimentations</option><option value="Portfolio">Portfolio</option><option value="A-classer" selected>À classer</option></select><input id="files" type="file" accept="image/*" capture="environment" multiple><button id="upload">AJOUTER LES CROQUIS</button><span id="status"></span></section><section id="folders" class="gallery"></section><section id="gallery" class="gallery"></section><div id="folder-modal" class="folder-modal"><div class="folder-box"><button id="folder-close">×</button><h2 id="folder-title"></h2><button id="folder-download">TÉLÉCHARGER LE DOSSIER</button><div id="folder-gallery" class="gallery"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const db=supabase.createClient('https://htkkbudgjwomxpwzirow.supabase.co','sb_publishable_f5l2P6t-qHInZIAZEtE34Q_LdQRYhbz'),gallery=document.querySelector('#gallery'),status=document.querySelector('#status');async function load(){const {data}=await db.storage.from('croquis').list('',{sortBy:{column:'created_at',order:'desc'}});gallery.innerHTML='';const folderNames=[['Projets','Projets'],['Expérimentations','Experimentations'],['Portfolio','Portfolio'],['À classer','A-classer']];document.querySelector('#folders').innerHTML='';Promise.all(folderNames.map(async([label,name])=>{const {data}=await db.storage.from('croquis').list(name);return [label,name,(data||[]).filter(x=>x.id).length]})).then(items=>items.forEach(([label,name,count])=>{const b=document.createElement('button');b.className='folder-card '+(count?'has-images':'empty-folder');b.innerHTML='<span>▰</span><strong>'+label+'</strong><small>'+count+' image'+(count>1?'s':'')+' · Ouvrir ↗</small>';b.onclick=()=>openFolder(name);document.querySelector('#folders').append(b)}));const files=(data||[]).filter(x=>x.id);if(!files.length)gallery.innerHTML='<div class="empty">Aucun croquis ajouté pour le moment.</div>';files.forEach(x=>addImage(gallery,x.name,x))}function formatSize(bytes){if(!bytes)return 'Taille inconnue';if(bytes<1024)return bytes+' o';if(bytes<1048576)return (bytes/1024).toFixed(1)+' Ko';return (bytes/1048576).toFixed(1)+' Mo'}function formatDate(value){if(!value)return 'Date inconnue';return new Date(value).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}function addImage(target,name,meta={}){const d=document.createElement('article');d.className='sketch';d.innerHTML='<img src="'+db.storage.from('croquis').getPublicUrl(name).data.publicUrl+'" alt="Croquis"><span class="sketch-meta">'+formatSize(meta.metadata?.size||meta.size)+' · '+formatDate(meta.created_at)+'</span><div class="sketch-actions"><a href="'+db.storage.from('croquis').getPublicUrl(name).data.publicUrl+'" download target="_blank" rel="noopener">TÉLÉCHARGER</a><button aria-label="Jeter ce croquis">JETER</button></div>';d.querySelector('button').onclick=async()=>{if(!confirm('Jeter définitivement ce croquis ?'))return;d.remove();const res=await db.storage.from('croquis').remove([name]);if(res.error){status.textContent=' '+res.error.message;target.append(d);return}load()};target.append(d)}let activeFolder='';async function openFolder(name){activeFolder=name;const {data}=await db.storage.from('croquis').list(name,{sortBy:{column:'created_at',order:'desc'}});document.querySelector('#folder-title').textContent='Dossier — '+name;const target=document.querySelector('#folder-gallery');target.innerHTML='';(data||[]).filter(x=>x.id).forEach(x=>addImage(target,name+'/'+x.name,x));document.querySelector('#folder-modal').classList.add('open')}document.querySelector('#folder-download').onclick=async()=>{if(!activeFolder)return;const {data}=await db.storage.from('croquis').list(activeFolder);const zip=new JSZip();for(const file of (data||[]).filter(x=>x.id)){const res=await db.storage.from('croquis').download(activeFolder+'/'+file.name);if(res.error)throw res.error;zip.file(file.name,res.data)}const out=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=activeFolder+'.zip';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#folder-close').onclick=()=>document.querySelector('#folder-modal').classList.remove('open');document.querySelector('#upload').onclick=async()=>{const files=[...document.querySelector('#files').files];if(!files.length)return;status.textContent=' Envoi…';for(const file of files){const folder=document.querySelector('#folder').value.trim()||'À classer';const name=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop();const res=await db.storage.from('croquis').upload(name,file,{contentType:file.type});if(res.error){status.textContent=' '+res.error.message;return}}status.textContent=' Ajouté ✓';document.querySelector('#files').value='';load()};load();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Croquis — Lazlo</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#f8f8f4 url('./fond.jpg') center/cover fixed;color:#242126;font-family:Inter,Arial}main{max-width:1120px;margin:auto;padding:0 34px 50px;background:#fdfdfbaa}header{height:245px;margin:0 -34px 18px;padding:28px 34px;background:#ff7043;position:relative}h1{font-size:clamp(3rem,6vw,5rem);font-weight:400;letter-spacing:-.09em;margin:35px 0}header p{position:absolute;left:40px;bottom:28px;font-size:.8rem}.back{color:#fff;text-decoration:none;position:absolute;right:34px;top:34px;font-size:.75rem}.upload{padding:14px 0;border-bottom:1px solid #242126}.upload input{font:inherit;font-size:.8rem}.upload button{background:#171717;color:#fff;border:0;padding:9px 14px;font-weight:600}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.sketch{position:relative;background:#fff}.sketch img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.sketch button{position:absolute;right:6px;top:6px;border:0;background:#ff7043;font-size:1.1rem}.empty{padding:35px 0}@media(max-width:600px){main{padding:0 16px 35px}header{margin:0 -16px 16px;padding:22px 18px;height:210px}h1{font-size:2.7rem;margin-top:45px}.back{right:18px;top:22px}.gallery{grid-template-columns:repeat(2,1fr)}}
/* Cartouche jaune d'ajout des croquis */
.upload{background:#ffff3f!important;padding:14px 16px!important;border:0!important}
.upload input{max-width:70%;font-size:.78rem}.upload button{margin-left:8px}
@media(max-width:600px){.upload input{max-width:100%;width:100%;margin-bottom:8px}.upload button{margin-left:0}}

#folders{grid-template-columns:repeat(4,1fr)!important;gap:0!important}.folder-title{grid-column:1/-1!important;background:transparent!important;padding:14px 0 8px!important;font-size:1.1rem}.folder-card{border:0;border-top:1px solid #242126;background:#ffff3f;text-align:left;padding:14px 12px;min-height:92px;display:flex;flex-direction:column;gap:6px;cursor:pointer}.folder-card+ .folder-card{border-left:1px solid #242126}.folder-card span{font-size:1.4rem}.folder-card strong{font-size:.9rem;font-weight:500}.folder-card small{font-size:.65rem}@media(max-width:700px){#folders{grid-template-columns:repeat(2,1fr)!important}.folder-card:nth-of-type(odd){border-left:0}}

</style></head><body><main><header><a class="back" href="./index.html">← Tableau de bord</a><h1>Croquis</h1><p>Recherches, essais et projets en cours</p></header><section class="upload"><select id="folder" aria-label="Dossier"><option value="Projets">Projets</option><option value="Experimentations">Expérimentations</option><option value="Portfolio">Portfolio</option><option value="A-classer" selected>À classer</option></select><input id="files" type="file" accept="image/*" capture="environment" multiple><button id="upload">AJOUTER LES CROQUIS</button><span id="status"></span></section><section id="folders" class="gallery"></section><section id="gallery" class="gallery"></section><div id="folder-modal" class="folder-modal"><div class="folder-box"><button id="folder-close">×</button><h2 id="folder-title"></h2><button id="folder-download">TÉLÉCHARGER LE DOSSIER</button><div id="folder-gallery" class="gallery"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const db=supabase.createClient('https://htkkbudgjwomxpwzirow.supabase.co','sb_publishable_f5l2P6t-qHInZIAZEtE34Q_LdQRYhbz'),gallery=document.querySelector('#gallery'),status=document.querySelector('#status');async function load(){const {data}=await db.storage.from('croquis').list('',{sortBy:{column:'created_at',order:'desc'}});gallery.innerHTML='';const folderNames=[['Projets','Projets'],['Expérimentations','Experimentations'],['Portfolio','Portfolio'],['À classer','A-classer']];document.querySelector('#folders').innerHTML='<div id="folder-title" class="folder-title">Dossiers de croquis</div>';folderNames.forEach(([label,name])=>{const b=document.createElement('button');b.className='folder-card';b.innerHTML='<span>▰</span><strong>'+label+'</strong><small>Ouvrir le dossier ↗</small>';b.onclick=()=>openFolder(name);document.querySelector('#folders').append(b)});const files=(data||[]).filter(x=>x.id);if(!files.length)gallery.innerHTML='<div class="empty">Aucun croquis ajouté pour le moment.</div>';files.forEach(x=>addImage(gallery,x.name))}function addImage(target,name){const d=document.createElement('article');d.className='sketch';d.innerHTML='<img src="'+db.storage.from('croquis').getPublicUrl(name).data.publicUrl+'" alt="Croquis"><button aria-label="Supprimer">×</button>';d.querySelector('button').onclick=async()=>{await db.storage.from('croquis').remove([name]);load()};target.append(d)}let activeFolder='';async function openFolder(name){activeFolder=name;const {data}=await db.storage.from('croquis').list(name,{sortBy:{column:'created_at',order:'desc'}});document.querySelector('#folder-title').textContent=name;const target=document.querySelector('#folder-gallery');target.innerHTML='';(data||[]).filter(x=>x.id).forEach(x=>addImage(target,name+'/'+x.name));document.querySelector('#folder-modal').classList.add('open')}document.querySelector('#folder-download').onclick=async()=>{if(!activeFolder)return;const {data}=await db.storage.from('croquis').list(activeFolder);const zip=new JSZip();for(const file of (data||[]).filter(x=>x.id)){const res=await db.storage.from('croquis').download(activeFolder+'/'+file.name);if(res.error)throw res.error;zip.file(file.name,res.data)}const out=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=activeFolder+'.zip';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#folder-close').onclick=()=>document.querySelector('#folder-modal').classList.remove('open');document.querySelector('#upload').onclick=async()=>{const files=[...document.querySelector('#files').files];if(!files.length)return;status.textContent=' Envoi…';for(const file of files){const folder=document.querySelector('#folder').value.trim()||'À classer';const name=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop();const res=await db.storage.from('croquis').upload(name,file,{contentType:file.type});if(res.error){status.textContent=' '+res.error.message;return}}status.textContent=' Ajouté ✓';document.querySelector('#files').value='';load()};load();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Croquis — Lazlo</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#f8f8f4 url('./fond.jpg') center/cover fixed;color:#242126;font-family:Inter,Arial}main{max-width:1120px;margin:auto;padding:0 34px 50px;background:#fdfdfbaa}header{height:245px;margin:0 -34px 18px;padding:28px 34px;background:#ff7043;position:relative}h1{font-size:clamp(3rem,6vw,5rem);font-weight:400;letter-spacing:-.09em;margin:35px 0}header p{position:absolute;left:40px;bottom:28px;font-size:.8rem}.back{color:#fff;text-decoration:none;position:absolute;right:34px;top:34px;font-size:.75rem}.upload{padding:14px 0;border-bottom:1px solid #242126}.upload input{font:inherit;font-size:.8rem}.upload button{background:#171717;color:#fff;border:0;padding:9px 14px;font-weight:600}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.sketch{position:relative;background:#fff}.sketch img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.sketch button{position:absolute;right:6px;top:6px;border:0;background:#ff7043;font-size:1.1rem}.empty{padding:35px 0}@media(max-width:600px){main{padding:0 16px 35px}header{margin:0 -16px 16px;padding:22px 18px;height:210px}h1{font-size:2.7rem;margin-top:45px}.back{right:18px;top:22px}.gallery{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><header><a class="back" href="./index.html">← Tableau de bord</a><h1>Croquis</h1><p>Recherches, essais et projets en cours</p></header><section class="upload"><input id="files" type="file" accept="image/*" multiple><button id="upload">AJOUTER LES CROQUIS</button><span id="status"></span></section><section id="gallery" class="gallery"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://htkkbudgjwomxpzwirow.supabase.co','sb_publishable_f5l2P6t-qHInZIAZEtE34Q_LdQRYhbz'),gallery=document.querySelector('#gallery'),status=document.querySelector('#status');async function load(){const {data}=await db.storage.from('croquis').list('',{sortBy:{column:'created_at',order:'desc'}});gallery.innerHTML='';if(!data?.length){gallery.innerHTML='<div class="empty">Aucun croquis ajouté pour le moment.</div>';return}data.forEach(x=>{const d=document.createElement('article');d.className='sketch';d.innerHTML='<img src="'+db.storage.from('croquis').getPublicUrl(x.name).data.publicUrl+'" alt="Croquis"><button aria-label="Supprimer">×</button>';d.querySelector('button').onclick=async()=>{await db.storage.from('croquis').remove([x.name]);load()};gallery.append(d)})}document.querySelector('#upload').onclick=async()=>{const files=[...document.querySelector('#files').files];if(!files.length)return;status.textContent=' Envoi…';for(const file of files){const name=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop();await db.storage.from('croquis').upload(name,file,{contentType:file.type})}status.textContent=' Ajouté ✓';document.querySelector('#files').value='';load()};db.channel('shared-croquis').on('postgres_changes',{event:'*',schema:'storage',table:'objects'},()=>load()).subscribe();load();</script></body></html>

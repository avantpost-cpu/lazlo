<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formations — Tableau de bord Lazlo</title><style>:root{--ink:#321d20;--paper:#f2e9de;--line:#c1b7ae;--blue:#135eaf;--red:#d95a17;--yellow:#edbd1c;--gray:#c1b7ae}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1500px;margin:auto;padding:28px 42px 52px}header{border:1px solid var(--ink);padding:24px;margin-bottom:18px}h1{font-size:clamp(2.4rem,6vw,5rem);margin:0;letter-spacing:-.07em}h2{margin:4px 0 0;font-weight:400;font-size:1.3rem}.back{display:inline-block;margin:0 0 18px;color:var(--ink);font-weight:700}.intro{font-size:1.1rem;max-width:760px;line-height:1.45}.toolbar{display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;padding:18px;margin-top:18px}.toolbar h3{margin:0;font-size:1.5rem}.toolbar input{font:inherit;padding:10px;border:0;width:280px}.form{background:var(--gray);padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.form input,.form textarea,.form select{font:inherit;padding:11px;border:1px solid #aaa;background:#fff;min-width:0}.form textarea{grid-column:span 2;min-height:80px}.form button{border:0;background:var(--red);color:#fff;font-weight:800;padding:12px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);padding:18px;position:relative}.card::after{content:'';position:absolute;right:0;bottom:0;width:34px;height:34px;background:#5a4846;clip-path:polygon(0 0,100% 0,0 100%)}.card h3{margin:0 0 4px;font-size:1.45rem}.card .school{font-weight:700;color:var(--blue);margin-bottom:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{background:var(--paper);padding:9px;font-size:.95rem}.meta b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.card p{line-height:1.35}.remove{position:absolute;top:12px;right:14px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--red)}.empty{background:#fff;padding:28px;margin-top:14px;text-align:center}.home{display:inline-block;margin-top:28px;background:var(--yellow);padding:12px 18px;color:var(--ink);font-weight:800;text-decoration:none}@media(max-width:800px){main{padding:18px 14px}.form{grid-template-columns:1fr 1fr}.form textarea{grid-column:span 2}.cards{grid-template-columns:1fr}.toolbar{display:block}.toolbar input{width:100%;margin-top:12px}}@media(max-width:500px){.form{grid-template-columns:1fr}.form textarea{grid-column:auto}.meta{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="./index.html">← Retour au tableau de bord</a><header><h1>Carnet des formations</h1><h2>Recenser, comparer, choisir</h2><p class="intro">Une fiche par formation pour garder au même endroit les informations utiles à l’orientation de Lazlo et préparer les candidatures.</p></header><section class="toolbar"><h3>Formations repérées</h3><input id="search" placeholder="Rechercher une école, une ville..."></section><section class="form"><input id="name" placeholder="Formation"><input id="school" placeholder="Établissement"><input id="city" placeholder="Ville"><input id="type" placeholder="Type / spécialité"><input id="jpo" type="date" aria-label="Date de la journée portes ouvertes"><input id="immersion" type="date" aria-label="Date du mini-stage ou de l’immersion"><input id="portfolio" placeholder="Portfolio demandé ?"><input id="admission" placeholder="Modalités d’admission"><textarea id="expectations" placeholder="Attendus, remarques, points à vérifier"></textarea><button id="add">AJOUTER LA FORMATION</button></section><section id="cards" class="cards"></section><a class="home" href="./index.html">Retour au tableau de bord</a></main><script>const fields=['name','school','city','type','jpo','immersion','portfolio','admission','expectations'];function niceDate(v){if(!v)return'—';return new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}let data=JSON.parse(localStorage.getItem('lazlo-formations')||'[]');const cards=document.querySelector('#cards');function render(){const q=document.querySelector('#search').value.toLowerCase();cards.innerHTML='';const shown=data.filter(x=>x.name.toLowerCase().includes(q)||x.school.toLowerCase().includes(q)||x.city.toLowerCase().includes(q));if(!shown.length){cards.innerHTML='<div class="empty">Aucune formation enregistrée pour le moment.</div>';return}shown.forEach((x)=>{const i=data.indexOf(x);const d=document.createElement('article');d.className='card';d.innerHTML='<button class="remove" aria-label="Supprimer">×</button><h3>'+x.name+'</h3><div class="school">'+x.school+' — '+x.city+'</div><div class="meta"><div><b>Type / spécialité</b>'+x.type+'</div><div><b>JPO</b>'+x.jpo+'</div><div><b>Immersion</b>'+x.immersion+'</div><div><b>Portfolio</b>'+x.portfolio+'</div><div><b>Admission</b>'+x.admission+'</div></div><p><b>Attendus / remarques</b><br>'+x.expectations+'</p>';d.querySelector('.remove').onclick=()=>{data.splice(i,1);localStorage.setItem('lazlo-formations',JSON.stringify(data));render()};cards.append(d)})}document.querySelector('#add').onclick=()=>{const x=Object.fromEntries(fields.map(id=>[id,document.querySelector('#'+id).value.trim()]));if(!x.name&&!x.school)return;data.push(x);localStorage.setItem('lazlo-formations',JSON.stringify(data));fields.forEach(id=>document.querySelector('#'+id).value='');render()};document.querySelector('#search').oninput=render;render();</script></body></html>
